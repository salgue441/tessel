[package]
name = "tessel"
version = "0.1.0"
edition = "2024"
description = "A dynamic tiling window manager for Windows, inspired by Hyprland"
license = "MIT"
repository = "https://github.com/salgue441/tessel"

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
